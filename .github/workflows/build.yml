name: Build Windows app
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: powershell
        run: .\build.ps1
      - name: Test
        shell: powershell
        run: |
          $testProcess = Start-Process .\dist\Snapline.exe -ArgumentList '--self-test' -WindowStyle Hidden -Wait -PassThru
          if ($testProcess.ExitCode -ne 0) { throw 'Self-test failed.' }
          Get-Content .\dist\self-test.txt
      - name: Package
        shell: powershell
        run: |
          Copy-Item README.md,LICENSE -Destination dist
          Compress-Archive -Path dist\Snapline.exe,dist\Snapline.exe.config,dist\README.md,dist\LICENSE -DestinationPath Snapline-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Snapline-Windows
          path: Snapline-Windows.zip
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: gh release create $env:GITHUB_REF_NAME Snapline-Windows.zip --title "Snapline $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
